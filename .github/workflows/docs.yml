name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-26.04
    steps:
    - name: Check out repo's default branch
      uses: actions/checkout@v7
    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13' 
    - name: Install conan, cmake
      run: |
        pip install conan
        pip install cmake
        sudo apt-get install doxygen graphviz
    - name: Install with conan
      run: |
        conan config install .conan
        conan install . --build=missing  -pr:h=ubuntu-gcc15-amd64 -pr:h=build-release -pr:h=options-doc  -pr:b=ubuntu-gcc15-amd64 -pr:b=build-release -pr:b=options-doc
        cmake --preset=conan-release

    - name: Build docs
      run: |
        cmake --build build/Release --target doc -j4